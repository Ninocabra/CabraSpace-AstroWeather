# La recogida, fuera del escritorio de una vez.
#
# POR QUE. Mientras el scheduler vivio en un PC, lo que no estuviera encendido
# no se observaba, y no es teorico: la noche del 29-08-2026 el fotometro dejo de
# grabar a las 00:01 locales y no volvio hasta el amanecer -- justo las horas de
# Luna alta, que es el regimen que mas necesita comprobacion -- y la noche del
# 28-08 no tiene NI UNA fila. La pagina de AstroCamp solo publica el "ahora":
# una lectura no raspada es una lectura que nunca existio.
#
# LO QUE SE PAGA ES ARRANCAR, NO TRABAJAR. Raspar cloud.html son 0,1 s, pero
# GitHub redondea cada job al minuto: el coste lo fija cuantas veces arrancas,
# no cuanto haces dentro. El repo del motor es privado, asi que los minutos
# cuentan contra los 2.000 gratis al mes. La cuenta entera, con el consumo real
# de agosto medido, esta abajo en el bloque de `schedule`.
#
# Y EL RITMO NO LO PONE EL CRON DE GITHUB, que se midio y sirve una cita cada
# dos horas: lo pone un reloj de fuera que llama a `workflow_dispatch`. Tambien
# abajo, con las lineas exactas.
#
# QUE HACE FALTA PARA QUE ESTO ARRANQUE (secretos del repositorio):
#
#   REPOS_TOKEN     PAT clasico con scope `repo`, para leer y escribir en los
#                   repos de archivo (privado) y de datos (publico). El
#                   GITHUB_TOKEN de serie solo vale para ESTE repositorio.
#   AEMET_API_KEY   la de `.env`. Caduca el 05-12-2026.
#   ADS_URL         \ las dos de Copernicus ADS, tambien de `.env`.
#   ADS_KEY         /
#
# Y FUERA DE GITHUB, el reloj: un job en cron-job.org que hace POST a
# `/actions/workflows/colector.yml/dispatches` con un PAT fine-grained acotado
# a ESTE repositorio y con un solo permiso, `Actions: read and write`. Ese
# token NO es un secreto del repositorio y no esta en Settings -> Secrets: vive
# en cron-job.org, que es lo unico que necesita tenerlo. Si alguien lo roba
# puede lanzar el colector y leer logs de Actions; no puede leer el codigo, ni
# escribir, ni tocar los workflows, ni por tanto sacar AEMET_API_KEY ni ADS_KEY.
#
# Y EN EL ESCRITORIO, OJO: lo que relanza el scheduler local NO es una tarea
# programada. El 30-08 se cerro la sesion con "parado y comprobado que nada lo
# relanza" y a la manana siguiente estaba corriendo otra vez: lo arranca
# `%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\CabraSpace-AstroWeather.vbs`,
# de fecha 27-08. Los dos a la vez no rompen nada -- el deduplicador de
# `queries.py` absorbe lo repetido -- pero duplican pasadas y commits, y sobre
# todo TAPAN el fallo: mientras el PC este encendido parece que la recogida va
# bien aunque Actions no sirva una sola cita.

name: Colector

on:
  # EL RITMO YA NO VIVE AQUI, Y ESTO ES UNA MEDIDA, NO UNA OPINION.
  #
  # La noche del 30 al 31-08-2026 se conto: **28 citas programadas entre las
  # 20:00Z y las 05:47Z, 4 servidas** (14 %). Ninguna fallo -- `is:failure` da
  # cero en todo el repositorio -- simplemente NO se ejecutaron. Y las cuatro
  # que llegaron no salen repartidas al azar: 20:10, 21:53, 00:20 y 02:19, o
  # sea espaciadas 1h43, 2h27 y 1h59, y cada una puntual sobre su cita (+5 a
  # +20 min). Eso no es perdida aleatoria, es estrangulamiento: GitHub sirve
  # una cada dos horas PIDAS LO QUE PIDAS, asi que mover el cron de sitio no
  # arregla nada. Ficha [[github-actions-schedule-no-es-un-cron]].
  #
  # Lo que se perdio esa noche: el escritorio dejo de muestrear a las 20:14Z y
  # no volvio hasta las 05:52Z, y en esas 9 h 38 min los sensores de AstroCamp
  # se rasparon TRES veces. `cloud.html` solo publica el "ahora", asi que eso
  # no se recupera.
  #
  # LA SOLUCION: un reloj de fuera llama a `workflow_dispatch`, que es un
  # evento de API y se encola en el acto (medido: la pasada del EPS lanzada a
  # mano el 29-08 termino en 20 s). El `schedule` se queda de PERRO GUARDIAN.
  #
  # EL RITMO DE VERDAD vive en cron-job.org y se documenta AQUI para que este
  # fichero siga siendo la unica fuente de verdad. Y por eso mismo hay que
  # separar lo que ESTA PUESTO de lo que esta PROPUESTO:
  #
  # ---- LO QUE HAY CONFIGURADO HOY (01-09-2026), medido, no supuesto --------
  #
  #     0,30  *       cada media hora           ~48/dia
  #
  # No es lo que decia este fichero hasta hoy (afirmaba `*/15 19-23` y dos
  # bloques mas). Se comprobo mirando las ejecuciones reales: 14:00, 14:30,
  # 16:00, 16:30, 18:00, 18:30, 20:00, 20:30, 21:00, 21:30... y las lecturas de
  # techo del archivo, que caen en :01 y :31. Media hora, no un cuarto.
  #
  # Que un fichero que se declara fuente de verdad llevara semanas describiendo
  # un reloj que no era el configurado es su propio aviso: esto solo vale si se
  # contrasta contra las ejecuciones de vez en cuando.
  #
  # ---- LO PROPUESTO, **NO IMPLEMENTADO** (verano, abr-sep, UTC) ------------
  #
  # Decidido el 01-09-2026 dejarlo EN ESPERA hasta resolver lo del limite de
  # gasto (ver la cuenta mas abajo). El codigo del colector ya lo soporta
  # -- `scheduler.ritmo_de_techos` -- y es inerte mientras el reloj no cambie:
  # con pasadas de 30 minutos el trabajo esta vencido igual con periodo 3 que
  # con 10. NO hay que tocar codigo para activarlo, solo cron-job.org.
  #
  #     */5   19-20   VENTANA DE APERTURA      24/dia
  #     */15  21-23   vigilancia                12/dia
  #     */15  0-4     vigilancia                20/dia
  #                                            -------
  #                                            56/dia
  #
  # LA VENTANA DE APERTURA (01-09-2026). La pregunta del producto es si
  # AstroCamp abre, y eso se decide en la media hora larga alrededor del ocaso
  # astronomico. Hasta hoy el techo se leia cada 30 minutos: el ocaso del 01-09
  # cayo a las 20:11Z y el archivo tiene lecturas a las 19:01, 19:31, 20:01 y
  # 20:31. Si hubiera abierto a las 20:05 no lo habriamos sabido hasta las
  # 20:31, con la noche ya empezada.
  #
  # Cinco minutos desde una hora ANTES del ocaso y durante dos horas, o hasta
  # que abra. Despues, quince: un techo abierto se puede cerrar, y enterarse
  # tarde de eso es el mismo fallo por el otro lado.
  #
  # EL RELOJ SOLO NO BASTA, y esto es lo que casi se nos escapa. `sensores`
  # tenia periodo de 10 minutos para estar vencido en cualquier pasada de un
  # reloj de 15. Con un reloj de 5, ese mismo 10 pasa de red de seguridad a
  # TAPON: la mitad de las pasadas encuentran el trabajo no vencido, y se paga
  # el doble de runners para seguir muestreando cada 10 minutos. Por eso
  # `scheduler.ritmo_de_techos` baja el periodo a 3 minutos dentro de la
  # ventana. Las dos mitades se mueven juntas o no se mueve nada.
  #
  # LAS HORAS SON DE VERANO Y HAY QUE MOVERLAS CON LA ESTACION. El ocaso
  # astronomico en Nerpio va de las 21:30Z en junio a las 18:25Z en diciembre:
  #
  #     jun-jul   */5 20-22      sep-oct   */5 18-20
  #     ago       */5 19-21      nov-feb   */5 17-19
  #
  # El colector NO depende de que esto este bien afinado: calcula el ocaso de
  # cada noche por efemerides y acelera solo. Un reloj mal puesto pierde
  # resolucion; no publica nada falso.
  #
  # LO QUE CUESTA, y hay que decidirlo ANTES de subir el reloj:
  #
  #     51 normales x 1 min   = 51
  #      4 con prevision x 4  = 16
  #      1 lote diario x 4    =  4
  #     -------------------------
  #                             71 min/dia = ~2.130/mes
  #     + archivo del EPS         60
  #     -------------------------
  #                            ~2.190 de los 2.000 gratuitos
  #
  # Se sale por ~190 minutos, que a 0,008 $/min son ~1,50 $/mes. El problema NO
  # es el dinero: el limite de gasto de Actions viene a CERO por defecto, y con
  # cero los workflows se PARAN al agotar los minutos. La recogida se moriria a
  # mitad de mes y en silencio, que es exactamente el fallo del que venimos.
  #
  # Dos salidas, y hay que elegir una:
  #   1. Mover este workflow a un repo PUBLICO -- el de datos ya lo es -- y
  #      hacer checkout del motor privado con el PAT. Los minutos de repo
  #      publico son gratis y el techo desaparece para siempre.
  #   2. Subir el limite de gasto en Settings -> Billing.
  #
  # El bloque de DIA del diseno anterior ("0 6-18/2", 7/dia) se retira: lo
  # cubre ya el propio perro guardian y era lo menos valioso de los tres ritmos.
  schedule:
    # CUATRO AL DIA Y CADA SEIS HORAS, que no es un numero redondo: seis horas
    # es EXACTAMENTE el periodo de `forecast`, `prediccion` y `publicar`. Si el
    # reloj de fuera se muere en silencio, el producto sigue actualizandose a su
    # hora y lo unico que se degrada es la resolucion de sensores. Un respaldo
    # tiene que elegir QUE deja caer, y esto lo elige.
    #
    # Y en el minuto 13, no en el 0: los primeros minutos de cada hora son los
    # mas disputados de la cola compartida -- por eso el workflow del EPS se
    # movio a las y 43 el 29-08 -- y con cuatro citas al dia no hay margen para
    # regalar ninguna.
    - cron: "13 1,7,13,19 * * *"

    # LA CUENTA, con el consumo REAL de agosto delante (Settings -> Actions
    # usage metrics: 18 min en todo el mes, 13 del colector en 5 ejecuciones,
    # que cuadran al minuto con las duraciones observadas):
    #
    #   pasada normal .................. 45-47 s  -> 1 min facturado  MEDIDO
    #   pasada que rehace la prevision .. 3m34s   -> 4 min facturado  MEDIDO
    #   pasada del lote diario .......... sin medir -> 4 min estimado
    #
    # El comentario anterior suponia "+26 s" para la pasada con prevision. Son
    # 3m34s: cuatro veces mas. Con 32 disparos externos + 4 del guardian:
    #
    #   31 normales x 1 min             = 31
    #    4 con prevision x 4 min        = 16
    #    1 lote diario x 4 min          =  4
    #   ------------------------------------
    #                                     51 min/dia = ~1.550 min/mes
    #   + archivo del EPS                     60
    #   ------------------------------------
    #                                     ~1.610 de los 2.000 gratuitos
    #
    # El plan original decia ~1.450 con objetivo de 1.700; la medida lo deja en
    # ~1.610. Sigue cabiendo, pero el margen es del 20 % y no del 27 %. La
    # unica palanca que importa son esos 3m34s: bajarlos de 3 min ahorra
    # 4 min/dia, bajarlos de 2 ahorra 8.
    #
    # OJO AL SUELO DE FACTURACION: GitHub redondea cada job al minuto, asi que
    # una pasada de 35 s y una de 59 s cuestan lo mismo, y una de 61 s cuesta
    # el DOBLE.
  workflow_dispatch:
    inputs:
      forzar:
        description: "Trabajos a forzar aunque no toquen (separados por espacios)"
        required: false
        default: ""

# Dos pasadas a la vez se pisarian al empujar. La segunda espera.
concurrency:
  group: colector
  cancel-in-progress: false

permissions:
  contents: read          # no se escribe en ESTE repo; los push van con el PAT

jobs:
  recoger:
    runs-on: ubuntu-latest
    # Una pasada normal es un minuto. Si algo se cuelga esperando a una fuente,
    # que muera en vez de quemar el presupuesto del mes.
    timeout-minutes: 15

    env:
      ASTROWEATHER_ARCHIVE_REPO: ${{ github.workspace }}/archivo
      ASTROWEATHER_DATA_REPO: ${{ github.workspace }}/datos
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      ADS_URL: ${{ secrets.ADS_URL }}
      ADS_KEY: ${{ secrets.ADS_KEY }}

    steps:
      - name: Comprobar que hay credenciales
        env:
          TOKEN: ${{ secrets.REPOS_TOKEN }}
        run: |
          faltan=""
          [ -n "$TOKEN" ] || faltan="$faltan REPOS_TOKEN"
          [ -n "$AEMET_API_KEY" ] || faltan="$faltan AEMET_API_KEY"
          [ -n "$ADS_KEY" ] || faltan="$faltan ADS_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos:$faltan. Se ponen en Settings ->"\
                 "Secrets and variables -> Actions de este repositorio."
            exit 1
          fi

      - name: El motor
        uses: actions/checkout@v5

      - name: El archivo (privado) -- es el disco que sobrevive a la pasada
        uses: actions/checkout@v5
        with:
          repository: Ninocabra/CabraSpace-AstroWeather-Archive
          token: ${{ secrets.REPOS_TOKEN }}
          path: archivo
          # Solo hace falta la punta: lo que se escribe son ficheros NUEVOS.
          fetch-depth: 1

      - name: El repo de datos (publico) -- donde sale el producto
        uses: actions/checkout@v5
        with:
          repository: Ninocabra/CabraSpace-AstroWeather-Data
          token: ${{ secrets.REPOS_TOKEN }}
          path: datos
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          # La misma que el escritorio: una diferencia de version de Python es
          # una diferencia de numeros esperando a que alguien la descubra.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-colector.txt

      - run: pip install --quiet -r requirements-colector.txt

      - name: Que astropy no se descargue el IERS en cada pasada
        # Sin esto, la primera transformacion de coordenadas se baja
        # `finals2000A.all` (~3 MB) en CADA runner. La tabla que trae astropy
        # dentro sobra de largo para lo que se calcula aqui -- alturas al
        # decimo de grado, no astrometria -- y ademas hace la pasada
        # determinista en vez de depender de que un servidor responda.
        run: |
          mkdir -p ~/.astropy/config
          printf '[utils.iers]\nauto_download = False\n' > ~/.astropy/config/astropy.cfg

      - name: El raw del dia en curso, de la pasada anterior
        # Las paginas de cloud.html se agrupan en UN .tar.xz por dia terminado
        # (35,8x contra guardarlas sueltas), asi que durante el dia tienen que
        # acumularse en algun sitio que no sea el repo. En el escritorio era el
        # disco; aqui es la cache, que es gratis y no ensucia el historial.
        # Si se pierde, se pierde como mucho el raw de un dia: los valores ya
        # estan en `measurements`, que si viaja en cada pasada.
        uses: actions/cache/restore@v5
        with:
          path: data/raw
          key: colector-raw-${{ github.run_id }}
          restore-keys: colector-raw-

      - name: Montar data/ sobre el archivo
        # Los almacenes canonicos se ENLAZAN al clon del archivo: asi lo que
        # escriban los workers cae directamente donde se va a commitear, sin
        # copiar 74 MB en cada pasada. `raw/` NO se enlaza a proposito -- ahi
        # van los ficheros sueltos del dia, que el archivo solo quiere
        # agrupados -- y el raw del fotometro tampoco sube (37 MB recuperables).
        run: |
          mkdir -p data/raw
          for almacen in measurements forecasts daily_observations; do
            mkdir -p "archivo/$almacen"
            ln -sfn "$GITHUB_WORKSPACE/archivo/$almacen" "data/$almacen"
          done
          # Estado del producto: viaja como fichero suelto y vuelve al archivo
          # al final de la pasada (`archivepush.LOOSE`).
          for suelto in cloud_calibration.json open_hours_nerpio.json \
                        roof_climatology.json sky_floor.json \
                        estado_colector.json; do
            # `if`, no `[ -f ] && cp`: con `bash -e` un test que falla en la
            # ultima vuelta del bucle tumba el paso entero, y que falte un
            # fichero de estado la primera vez es NORMAL.
            if [ -f "archivo/$suelto" ]; then cp "archivo/$suelto" "data/$suelto"; fi
          done
          echo "data/ montado:"; ls -la data/

      - name: Identidad de git en los dos repos que se empujan
        run: |
          for repo in archivo datos; do
            git -C "$repo" config user.name "github-actions[bot]"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          done

      - name: Una pasada
        run: |
          python -m astroweather.colector \
            ${{ github.event.inputs.forzar && format('--forzar {0}', github.event.inputs.forzar) || '' }}

      - name: Tirar del raw local los dias que ya estan agrupados
        # Sin esto la cache crece para siempre: 48 paginas al dia que ya viven
        # comprimidas 35x dentro del .tar.xz del archivo. Se borra SOLO lo que
        # se puede demostrar archivado -- existe su bundle -- que es la unica
        # forma segura de borrar un dato que no se puede volver a pedir.
        if: always()
        run: |
          for fuente in astrocamp_cloudhtml astrocamp_allsky; do
            base="raw/site=nerpio/source=$fuente"
            [ -d "archivo/$base" ] || continue
            find "archivo/$base" -name '*.tar.xz' -print0 | while IFS= read -r -d '' b; do
              dia=$(basename "$b" .tar.xz)
              find "data/$base" -name "${dia}T*" -delete 2>/dev/null || true
            done
          done
          du -sh data/raw 2>/dev/null || true

      - name: Guardar el raw del dia para la pasada siguiente
        # `always()` porque el raw ya raspado es dato aunque otro trabajo haya
        # fallado despues: tirarlo por un fallo ajeno seria perderlo del todo.
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/raw
          key: colector-raw-${{ github.run_id }}

      - name: Que se hizo
        if: always()
        run: tail -40 data/scheduler.log || echo "sin log"
